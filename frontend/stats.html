<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard – RESPAWN</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  color:rgb(248, 250, 248);
  background:#022c22;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 24px;
  background:#065f46;
  position:sticky;
  top:0;
}

.btn{
  border:none;
  border-radius:8px;
  padding:8px 12px;
  background:white;
  color:#065f46;
}

/* PROFILE MINI */
.profileMini{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  margin:10px;
  cursor:pointer;
}

.profileMini img{
  width:54px;
  height:54px;
  border-radius:50%;
  border:3px solid #4ade80;
  object-fit:contain;
  background:#022c22;
  padding:3px;
}

/* XP */
.xpCard{
  margin-top:6px;
  background:#065f46;
  padding:8px 12px;
  border-radius:16px;
  width:200px;
  border:2px solid #4ade80;
}

.xpRow{
  display:flex;
  justify-content:space-between;
  font-size:13px;
}

.xpBar{
  height:8px;
  background:#022c22;
  border-radius:10px;
}

.xpFill{
  height:100%;
  background:#22c55e;
  border-radius:10px;
  transition:.4s;
}

/* MAIN */
.container{
  padding:12px;
  max-width:1000px;
  margin:auto;
}

.heroCard{
  background:rgba(0,0,0,0.55);
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.avatar{
  width:170px;
  height:170px;
  object-fit:contain;
}

.flexRow{
  display:flex;
  gap:10px;
  margin-top:10px;
  flex-wrap:wrap;
}

.panel{
  background:rgba(0,0,0,0.55);
  border-radius:12px;
  padding:10px;
  flex:1;
  min-width:260px;
}

.bar{height:8px;background:#022c22;border-radius:8px;}
.fill{height:100%;background:#4ade80;}

.row{display:flex;gap:6px;flex-wrap:wrap;}
.tag{
  padding:6px 10px;
  border-radius:10px;
  background:#022c22;
  border:1px solid #4ade80;
  font-size:13px;
}

/* PROFILE MODAL FIXED */
#profileModal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.card{
  background:#065f46;
  width:90%;
  max-width:460px;
  max-height:82%;
  overflow-y:auto;
  border-radius:14px;
  padding:20px;
  box-sizing:border-box;
}

.field{
  margin:10px 0;
  width:100%;
}

.field input,
.field select{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:none;
  height:42px;
  box-sizing:border-box;
}

.avatarGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.avatarGrid img{
  width:76px;height:76px;
  border-radius:50%;
  border:3px solid transparent;
  cursor:pointer;
  object-fit:contain;
  background:#022c22;
  padding:4px;
}

.selected{
  border-color:#4ade80 !important;
  box-shadow:0 0 10px #4ade80;
}

.saveBtn{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:white;
  color:#065f46;
}

/* MENU */
.menu-icon{font-size:26px;cursor:pointer;}

.side-menu{
  position:fixed;
  top:72px;
  right:24px;
  background:white;
  padding:16px 20px;
  border-radius:14px;
  display:none;
}
.side-menu a{
  display:block;
  padding:10px 4px;
  color:#065f46;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
  <div>RESPAWN</div>

  <div style="display:flex;gap:12px;">
    <button class="btn" onclick="logout()">Logout</button>
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
  </div>
</div>

<div class="side-menu" id="menu">
  <a href="stats.html">Home</a>
  <a href="quests.html">Quests</a>
  <a href="calendar.html">Calendar & Boss</a>
  <a href="work.html">Work</a>
</div>

<div class="profileMini" onclick="openProfile()">
  <img id="miniAv" />
  <div>
    <div id="miniName"></div>

    <div class="xpCard">
      <div class="xpRow">
        <span id="levelTxt"></span>
        <span id="xpFraction"></span>
      </div>
      <div class="xpBar"><div class="xpFill" id="xpFill"></div></div>
    </div>
  </div>
</div>

<div class="container">
<div class="heroCard">
  <img id="av" class="avatar" />
  <div id="moodTxt"></div>
</div>

<div class="flexRow">
<div class="panel"><b>✨ Buffs</b><div id="buffBox" class="row"></div></div>

<div class="panel">
<b>📊 Stats</b><br>
Energy <span id="eTxt"></span><div class="bar"><div class="fill" id="eBar"></div></div>
Health <span id="hTxt"></span><div class="bar"><div class="fill" id="hBar"></div></div>
Focus <span id="fTxt"></span><div class="bar"><div class="fill" id="fBar"></div></div>
Resilience <span id="rTxt"></span><div class="bar"><div class="fill" id="rBar"></div></div>
</div>

<div class="panel"><b>⚠️ Debuffs</b><div id="debuffBox" class="row"></div></div>
</div>
</div>

<!-- PROFILE CARD -->
<div id="profileModal" onclick="closeOutside(event)">
<div class="card">

<h3>Player Profile</h3>

<div style="text-align:center">
<img id="pAv" style="width:90px;height:90px;border-radius:50%">
</div>

<div class="field">
<label>Username</label>
<input id="uName">
</div>

<div class="field">
<label>Email</label>
<input id="uEmail">
</div>

<div class="field">
<label>Gender</label>
<select id="uGender">
<option>Male</option>
<option>Female</option>
</select>
</div>

<label>Choose Avatar</label>
<div class="avatarGrid" id="grid"></div>

<button class="saveBtn" onclick="saveProfile()">Save</button>

</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

let profile = JSON.parse(localStorage.getItem('profile')||'{}');
const input = JSON.parse(localStorage.getItem('dailyInputs')||'{}');
const xpData = JSON.parse(localStorage.getItem('xpData'))||{xp:0,level:1,nextLevelXp:100};

function path(v){
  return '../assets/images/' + v;
}

/* ===== SUPER SAFE AVATAR BASE ===== */
function getBaseAvatar(a){
  if(!a) return "m1";

  a = a.replace(".png","");      // remove extension
  return a.split("-")[0];        // m2-normal → m2
}

let base = getBaseAvatar(profile.avatar);

/* MINI PROFILE */
miniName.innerText = profile.username || 'Player';
miniAv.src = path(base + '-normal.png');

/* XP */
function renderXP(d){
 levelTxt.innerText='Level '+d.level;
 xpFraction.innerText=d.xp+' / '+d.nextLevelXp+' XP';
 xpFill.style.width=(d.xp/d.nextLevelXp*100)+'%';
}
renderXP(xpData);

/* ===== CALCULATE STATS ===== */
function calculate(i){
 let s={energy:50,health:50,focus:50,resilience:50};

 if(i.sleep>=7) s.energy+=10;
 if(i.sleep<5) s.energy-=15;

 if(i.stress>=4){s.focus-=10;s.health-=5;}

 if(i.water>=3) s.energy+=5;
 if(i.exercise){s.health+=10;s.resilience+=10;}

 for(let k in s)s[k]=Math.max(0,Math.min(100,s[k]));
 return s;
}

const stats=calculate(input);

/* ===== MOOD DETECTION ===== */
let mood='Normal';

if(input.stress>=4 || stats.health<40)
   mood='Stressed';

else if(stats.energy>65)
   mood='Energetic';

else if(stats.energy<45)
   mood='Tired';

moodTxt.innerText='Mood: '+mood;

/* ===== MOST IMPORTANT FIX ===== */
av.src = path(base + '-' + mood.toLowerCase() + '.png');

/* ===== SHOW BARS ===== */
function show(id,val){
 document.getElementById(id).style.width=val+'%';
 document.getElementById(id.replace('Bar','Txt')).innerText=val+'%';
}

show('eBar',stats.energy);
show('hBar',stats.health);
show('fBar',stats.focus);
show('rBar',stats.resilience);

/* BUFFS */
if(stats.energy>65)
 buffBox.innerHTML+=`<div class='tag'>⚡ High Energy</div>`;

if(input.exercise)
 buffBox.innerHTML+=`<div class='tag'>💪 Active</div>`;

if(stats.energy<40)
 debuffBox.innerHTML+=`<div class='tag'>😴 Fatigue</div>`;

if(stats.health<40)
 debuffBox.innerHTML+=`<div class='tag'>🔥 Burnout</div>`;

/* ===== PROFILE CARD ===== */
window.openProfile = function(){
 profileModal.style.display='flex';

 uName.value=profile.username||'';
 uEmail.value=profile.email||'';
 uGender.value=profile.gender||'Male';

 pAv.src=path(base+'-normal.png');

 grid.innerHTML='';
 let list=['m1','m2','m3','m4','f1','f2','f3','f4'];

 list.forEach(v=>{
   let img=document.createElement('img');
   img.src=path(v+'-normal.png');

   if(base===v) img.classList.add('selected');

   img.onclick=()=>{
     document.querySelectorAll('.avatarGrid img')
       .forEach(i=>i.classList.remove('selected'));

     img.classList.add('selected');

     profile.avatar=v+'-normal.png';
     base=v;

     pAv.src=img.src;
   };

   grid.appendChild(img);
 });
};

window.saveProfile = function(){
 profile.username=uName.value;
 profile.email=uEmail.value;
 profile.gender=uGender.value;

 localStorage.setItem('profile',JSON.stringify(profile));
 location.reload();
};

window.closeOutside = function(e){
 if(e.target.id==='profileModal')
   profileModal.style.display='none';
};

window.toggleMenu = function(){
 menu.style.display =
   menu.style.display==="block"?"none":"block";
};

window.logout = function(){
 location.href='index.html';
};

}); // DOM END
</script>


</body>
</html>
