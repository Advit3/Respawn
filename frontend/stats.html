<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard – RESPAWN</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  color:white;
}

/* ===== FULL SCREEN VIDEO BG ===== */
#moodVideo{
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
  opacity:0.75;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 24px;
  background:#065f46;
  color:white;
  position:sticky;
  top:0;
}

.logo{ font-weight:bold; letter-spacing:1px; }

.btn{
  border:none;
  border-radius:8px;
  padding:8px 12px;
  background:white;
  color:#065f46;
}

/* ===== MINI PROFILE ===== */
.profileMini{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(0,0,0,0.55);
  padding:8px;
  border-radius:10px;
  margin:10px;
}

.profileMini img{
  width:44px;
  height:44px;
  border-radius:50%;
  border:2px solid #4ade80;
}

.container{
  padding:12px;
  max-width:1000px;
  margin:auto;
}

/* ===== HERO CARD ===== */
.heroCard{
  background:rgba(0,0,0,0.55);
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.avatar{
  width:160px;
  height:160px;
  object-fit:contain;
}

.mood{
  margin-top:6px;
  font-weight:bold;
}

/* ===== ONE LINE LAYOUT ===== */
.flexRow{
  display:flex;
  gap:10px;
  margin-top:10px;
  flex-wrap:wrap;
}

.panel{
  background:rgba(0,0,0,0.55);
  border-radius:12px;
  padding:10px;
  flex:1;
  min-width:260px;
}

/* ===== STATS ===== */
.bar{
  height:8px;
  background:#022c22;
  border-radius:8px;
}

.fill{
  height:100%;
  background:#4ade80;
}

/* ===== TAGS ===== */
.row{display:flex;gap:6px;flex-wrap:wrap;}

.tag{
  padding:6px 10px;
  border-radius:10px;
  background:#022c22;
  border:1px solid #4ade80;
  font-size:13px;
}
</style>
</head>

<body>

<video id="moodVideo" autoplay muted loop playsinline></video>

<div class="header">
  <div class="logo">RESPAWN</div>
  <button class="btn" onclick="logout()">Logout</button>
</div>

<div class="profileMini">
  <img id="miniAv" />
  <div>
    <div id="miniName"></div>
    <div>⭐ XP: <span id="xpTxt"></span></div>
  </div>
</div>

<div class="container">

<div class="heroCard">
  <img id="av" class="avatar" />
  <div class="mood" id="moodTxt"></div>
</div>

<div class="flexRow">

<div class="panel">
  <b>✨ Buffs</b>
  <div class="row" id="buffBox"></div>
</div>

<div class="panel">
  <b>📊 Stats</b>

  Energy <span id="eTxt"></span>
  <div class="bar"><div class="fill" id="eBar"></div></div>

  Health <span id="hTxt"></span>
  <div class="bar"><div class="fill" id="hBar"></div></div>

  Focus <span id="fTxt"></span>
  <div class="bar"><div class="fill" id="fBar"></div></div>

  Resilience <span id="rTxt"></span>
  <div class="bar"><div class="fill" id="rBar"></div></div>
</div>

<div class="panel">
  <b>⚠️ Debuffs</b>
  <div class="row" id="debuffBox"></div>
</div>

</div>
</div>

<script>
const profile = JSON.parse(localStorage.getItem('profile')||'{}');
const input   = JSON.parse(localStorage.getItem('dailyInputs')||'{}');

miniAv.src = profile.avatar || '';
miniName.innerText = profile.username || 'Player';

function calculate(i){
 let s={energy:50,health:50,focus:50,resilience:50};

 if(i.sleep>=7) s.energy+=10;
 if(i.sleep<5) s.energy-=15;

 if(i.stress>=4){
   s.focus-=10;
   s.health-=5;
 }

 if(i.water>=3) s.energy+=5;

 if(i.exercise){
   s.health+=10;
   s.resilience+=10;
 }

 for(let k in s)
   s[k]=Math.max(0,Math.min(100,s[k]));

 return s;
}

const stats = calculate(input);

let mood="Normal";
let video="../assets/videos/cloudy.mp4";

if(input.stress>=4 || stats.health<40 || stats.resilience<40){
 mood="Stressed";
 video="../assets/videos/rain.mp4";
}

else if(stats.energy>65 || (input.exercise && input.sleep>=7)){
 mood="Energetic";
 video="../assets/videos/sunny.mp4";
}

else if(stats.energy<45 || input.sleep<5){
 mood="Tired";
 video="../assets/videos/night.mp4";
}

document.getElementById('moodTxt').innerText="Mood: "+mood;

/* ✅ FIXED PATH HERE ONLY */
let base = profile.avatar?.split('.')[0] || "m1";
document.getElementById('av').src =
   "../assets/images/" + base + "-" + mood.toLowerCase() + ".png";

const v=document.getElementById('moodVideo');
v.src=video;
v.load();
v.play();

function show(id,val){
 document.getElementById(id).style.width=val+'%';
 document.getElementById(id.replace('Bar','Txt')).innerText=val+'%';
}

show('eBar',stats.energy);
show('hBar',stats.health);
show('fBar',stats.focus);
show('rBar',stats.resilience);

if(stats.energy>65)
 buffBox.innerHTML+=`<div class='tag'>⚡ High Energy</div>`;

if(input.exercise)
 buffBox.innerHTML+=`<div class='tag'>💪 Active</div>`;

if(stats.energy<40)
 debuffBox.innerHTML+=`<div class='tag'>😴 Fatigue</div>`;

if(stats.health<40)
 debuffBox.innerHTML+=`<div class='tag'>🔥 Burnout</div>`;

function logout(){
 location.href='index.html';
}
</script>

</body>
</html>
