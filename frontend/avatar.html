<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Avatar - RESPAWN</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;

  /* ✅ FIXED BG PATH PNG */
  background:url('../assets/images/bg.png') no-repeat center center fixed;
  background-size:cover;

  color:white;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:-1;
}

/* BACK BUTTON */
.back{
  position:fixed;
  top:12px;
  left:12px;
  background:#065f46;
  color:white;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  z-index:100;
}

.container{
  flex:1;
  padding:16px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:rgba(0,0,0,0.68);
  padding:22px;
  border-radius:14px;
  width:520px;
  max-width:100%;
}

h2{text-align:center;}

.gender-box{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.gender{
  flex:1;
  text-align:center;
  padding:12px;
  border:2px solid #4ade80;
  border-radius:10px;
  cursor:pointer;
  transition:.3s;
}

.gender.selected{
  background:#065f46;
  box-shadow:0 0 10px #4ade80;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:12px;
  margin-top:12px;
}

.avatar{
  border:2px solid #4ade80;
  border-radius:10px;
  padding:6px;
  text-align:center;
  cursor:pointer;
  transition:.3s;
  background:#022c22;
}

.avatar img{
  width:100%;
  height:120px;
  object-fit:contain;
  border-radius:8px;
}

.avatar.selected{
  border:2px solid white;
  box-shadow:0 0 14px white;
  background:#065f46;
}

.input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:2px solid #4ade80;
  border-radius:8px;
  background:#022c22;
  color:#ecfdf5;
  box-sizing:border-box;
}

.btn{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:white;
  color:#065f46;
  font-weight:bold;
}

@media(max-width:600px){
  .card{width:95%;}
  .avatar img{height:100px;}
}
</style>
</head>

<body>

<div class="back" onclick="location.href='index.html'">← Back</div>

<div class="container">
<div class="card">

<h2>Step 1 – Select Gender</h2>

<div class="gender-box">
  <div class="gender" onclick="chooseGender('male',this)">Male</div>
  <div class="gender" onclick="chooseGender('female',this)">Female</div>
</div>

<div id="avatarSection" style="display:none;">
<h2>Step 2 – Choose Your Hero</h2>

<div class="grid" id="avatarGrid"></div>

<input class="input" id="username" placeholder="Enter avatar name / username" />

<button class="btn" onclick="save()">Continue</button>
</div>

</div>
</div>

<script>
let selectedGender=null;

const maleAvatars=['m1.png','m2.png','m3.png','m4.png'];
const femaleAvatars=['f1.png','f2.png','f3.png','f4.png'];

function chooseGender(g,el){
 selectedGender=g;

 document.querySelectorAll('.gender')
   .forEach(x=>x.classList.remove('selected'));

 el.classList.add('selected');

 const list = g==='male' ? maleAvatars : femaleAvatars;
 const grid = document.getElementById('avatarGrid');

 grid.innerHTML='';

 list.forEach(file=>{
  grid.innerHTML += `
   <div class="avatar" onclick="select(this)" data-id="${file}">
     <!-- ✅ FIXED AVATAR PATH -->
     <img src="../assets/images/${file}">
   </div>`;
 });

 document.getElementById('avatarSection').style.display='block';
}

function select(el){
 document.querySelectorAll('.avatar')
   .forEach(a=>a.classList.remove('selected'));

 el.classList.add('selected');
}

async function save(){
 const chosen = document.querySelector('.avatar.selected');
 const name   = document.getElementById('username').value.trim();

 if(!chosen){ alert('Select avatar'); return; }
 if(!name){ alert('Enter username'); return; }

 const data={
   gender:selectedGender,
   avatar:chosen.dataset.id,
   username:name
 };

 localStorage.setItem('profile',JSON.stringify(data));

 location.href='input.html';
}
</script>

</body>
</html>
