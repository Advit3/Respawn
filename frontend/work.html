<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Work – RESPAWN</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#021a14;
  color:white;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 24px;
  background:#065f46;
}

/* BACK BUTTON */
.backBtn{
  color:white;
  text-decoration:none;
  background:#022c22;
  padding:6px 12px;
  border-radius:8px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* BOARD */
.board{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:10px;
}

.card{
  background:rgba(0,0,0,0.55);
  border-radius:16px;
  padding:12px;
}

/* TOAST */
.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#065f46;
  border:1px solid #4ade80;
  padding:12px 16px;
  border-radius:12px;
  font-size:14px;
  opacity:0;
}

.toast.show{
  animation: popIn .6s forwards;
}

@keyframes popIn{
  from{opacity:0;top:0;}
  to{opacity:1;top:20px;}
}

/* INPUTS */
input, select{
  width:100%;
  padding:8px;
  border-radius:10px;
  border:none;
  margin-top:4px;
  box-sizing:border-box;
}

.btn{
  margin-top:6px;
  padding:8px 10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
}

/* TASK */
.todo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#022c22;
  padding:10px;
  border-radius:12px;
  margin-top:8px;
  border:1px solid #4ade80;
  transition:.4s;
}

.glow{
  box-shadow:0 0 16px #4ade80;
  transform:scale(1.02);
}

/* FOCUS COMPASS */
.stateBox{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.state{
  background:#022c22;
  padding:12px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  border:1px solid #4ade80;
  transition:.3s;
}

.state.active{
  background:#065f46;
  box-shadow:0 0 14px #4ade80;
}

.suggest{
  background:#065f46;
  padding:8px;
  border-radius:10px;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="header">
  <div>RESPAWN – Work Mode</div>

  <!-- BACK TO STATS -->
  <a href="stats.html" class="backBtn">Back</a>
</div>

<div class="toast" id="toast"></div>

<div class="container">

<!-- ===== ADD TASK BACK ===== -->
<div class="card">
<h3>📝 Add Task</h3>

<input id="taskInput" placeholder="Task name..." />

<select id="taskType">
  <option value="study">Study</option>
  <option value="work">Work</option>
  <option value="health">Health</option>
  <option value="personal">Personal</option>
</select>

<button class="btn" onclick="addTask()">Add Task</button>
</div>

<!-- ===== BOARD ===== -->
<div class="board">

<div class="card">
  <h4>🚧 Ongoing Tasks</h4>
  <div id="ongoingBox"></div>
</div>

<div class="card">
  <h4>✅ Completed Tasks</h4>
  <div id="completedBox"></div>
</div>

</div>

<!-- ===== FOCUS COMPASS ===== -->
<div class="card" style="margin-top:20px">
  <h3>🧭 Focus Compass</h3>

  <div class="stateBox">
    <div class="state" onclick="toggleHelp('low',this)">😵 Low Focus</div>
    <div class="state" onclick="toggleHelp('fatigue',this)">😴 Fatigued</div>
    <div class="state" onclick="toggleHelp('over',this)">⚡ Overstimulated</div>
  </div>

  <div id="helpBox"></div>
</div>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
let completed = JSON.parse(localStorage.getItem('completed') || '[]');

/* TOAST */
function showToast(msg){
  toast.innerText = msg;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },6000);
}

/* RENDER */
function render(){

 ongoingBox.innerHTML='';
 completedBox.innerHTML='';

 tasks.forEach((t,i)=>{

  ongoingBox.innerHTML += `
   <div class="todo" id="task${i}">
     <div>${t.title}</div>

     <button class="btn"
       onclick="finish(${i})">
       Finished
     </button>
   </div>`;
 });

 completed.forEach(t=>{
  completedBox.innerHTML += `
   <div class="todo">
     <div>${t.title}</div>
   </div>`;
 });
}

/* ADD TASK */
function addTask(){

 let title = taskInput.value;
 let type = taskType.value;

 if(!title) return;

 tasks.push({
  title,
  type,
  createdAt:new Date().toISOString()
 });

 taskInput.value='';
 save();
}

/* FINISH FLOW */
function finish(i){

 let box = document.getElementById("task"+i);

 box.classList.add("glow");

 setTimeout(()=>{

   let t = tasks[i];
   completed.push(t);
   tasks.splice(i,1);

   save();

   showToast("+5 XP Gained 🎉");

 },4000);
}

function save(){
 localStorage.setItem('tasks',JSON.stringify(tasks));
 localStorage.setItem('completed',JSON.stringify(completed));
 render();
}

/* FOCUS COMPASS TOGGLE */
function toggleHelp(type,btn){

 if(btn.classList.contains("active")){
   btn.classList.remove("active");
   helpBox.innerHTML="";
   return;
 }

 document.querySelectorAll(".state")
   .forEach(b=>b.classList.remove("active"));

 btn.classList.add("active");

 if(type=="low"){
  helpBox.innerHTML=`
   <div class='suggest'>⏱ 25-min focus sprint</div>
   <div class='suggest'>🌬 2-min breathing</div>
   <div class='suggest'>🪨 Start smallest task</div>
   <div class='suggest'>📵 Keep phone away</div>
   <div class='suggest'>🎧 Lofi music</div>`;
 }

 if(type=="fatigue"){
  helpBox.innerHTML=`
   <div class='suggest'>🚶 Short walk</div>
   <div class='suggest'>💧 Drink water</div>
   <div class='suggest'>😴 Power nap</div>
   <div class='suggest'>🍎 Light snack</div>
   <div class='suggest'>🧘 Stretch body</div>`;
 }

 if(type=="over"){
  helpBox.innerHTML=`
   <div class='suggest'>🔕 Silence 5 min</div>
   <div class='suggest'>📱 Dim screen</div>
   <div class='suggest'>🎯 One task only</div>
   <div class='suggest'>📝 Brain dump list</div>
   <div class='suggest'>🫁 Slow breathing</div>`;
 }
}

render();
</script>

</body>
</html>
